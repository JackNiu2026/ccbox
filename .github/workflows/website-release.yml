name: Assemble CCBox website with verified release downloads
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact 40-character SHA of the ccbox-vVERSION tag on main
        required: true
        type: string
      platforms:
        description: 'Exact platforms to publish, separated by spaces (windows macos macos-intel linux android)'
        required: true
        default: windows macos macos-intel linux android
        type: string
      release_runs:
        description: Successful release candidate run IDs, separated by spaces
        required: true
        type: string
permissions:
  actions: read
  contents: read

jobs:
  assemble:
    if: github.repository == 'JackNiu2026/ccbox' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_REF: ${{ inputs.ref }}
      RELEASE_PLATFORMS: ${{ inputs.platforms }}
      RELEASE_RUNS: ${{ inputs.release_runs }}
      SITE_URL: ${{ vars.SITE_URL }}
      PUBLIC_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
    steps:
      - name: Require an immutable build source
        run: '[[ "$BUILD_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: www/package-lock.json
      - name: Retrieve only successful CCBox release artifacts
        run: |
          set -euo pipefail
          node scripts/release-version.mjs source "$BUILD_REF"
          git merge-base --is-ancestor "$BUILD_REF" origin/main
          [[ "$RELEASE_RUNS" =~ ^[0-9]+([[:blank:]]+[0-9]+){0,4}$ ]]
          node --input-type=module -e '
            const url = new URL(process.env.SITE_URL);
            if (url.href !== "https://ccbox.org/") throw Error("Set SITE_URL to https://ccbox.org");
          '
          read -ra runs <<< "$RELEASE_RUNS"
          for run in "${runs[@]}"; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" \
              --jq '[.event,.head_branch,.path,.conclusion] | @tsv' |
              grep -Fx $'workflow_dispatch\tmain\t.github/workflows/release-platforms.yml\tsuccess'
            gh run download "$run" --repo "$GITHUB_REPOSITORY" \
              --pattern release-windows --pattern release-macos --pattern release-macos-intel --pattern release-linux --pattern release-android \
              --dir "$RUNNER_TEMP/ccbox-release/$run"
          done
      - name: Verify package identities and build the website
        run: |
          set -euo pipefail
          node --test www/scripts/stage-downloads.test.mjs
          version=$(tr -d '\r\n' < VERSION)
          packages=()
          metadata_files=()
          shopt -s nullglob
          for artifact in "$RUNNER_TEMP"/ccbox-release/*/release-*; do
            mapfile -t metadata < <(find "$artifact" -type f -name build-metadata.json)
            [[ ${#metadata[@]} == 1 ]] || { echo "Expected one build-metadata.json in $artifact." >&2; exit 1; }
            expected_platform="${artifact##*/release-}"
            node -e 'const [file, platform] = process.argv.slice(1); if (JSON.parse(require("node:fs").readFileSync(file, "utf8")).platform !== platform) throw Error("Artifact name and metadata platform differ");' "${metadata[0]}" "$expected_platform"
            metadata_files+=("${metadata[0]}")
            packages+=("$(dirname "${metadata[0]}")")
          done
          node scripts/release-version.mjs verify-packages "$BUILD_REF" "$RELEASE_PLATFORMS" "${metadata_files[@]}"
          notes="$RUNNER_TEMP/ccbox-release-notes.md"
          printf '# CCBox %s\n\n源码提交 / Source commit: %s\n\n安装前请核对 SHA-256。\n' "$version" "$BUILD_REF" > "$notes"
          node www/scripts/stage-downloads.mjs --notes "$notes" "${packages[@]}"
          node --input-type=module -e '
            import { readSiteRelease } from "./www/scripts/stage-downloads.mjs";
            const release = await readSiteRelease();
            const platforms = {windows:["windowsDownloadURL","windowsPreview"], macos:["downloadURL","macosPreview"], "macos-intel":["macosIntelDownloadURL","macosIntelPreview"], linux:["linuxDownloadURL"], android:["androidDownloadURL"]};
            const expected = new Set(process.env.RELEASE_PLATFORMS.trim().split(/\s+/));
            for (const [platform, fields] of Object.entries(platforms)) {
              if (fields.some(field => release[field]) !== expected.has(platform)) throw Error("Staged installer does not match the selected platforms: " + platform);
            }
          '
          # Apply the first-party website guide edits without changing the tagged package inputs.
          for guide in docs/guide/network.md docs/guide/desktop.md docs/guide/guest-systems.md; do
            git show "$GITHUB_WORKFLOW_SHA:$guide" > "$RUNNER_TEMP/ccbox-guide.md"
            cp "$RUNNER_TEMP/ccbox-guide.md" "$guide"
          done
          npm ci --prefix www --no-audit --no-fund
          npm run --prefix www check
          npm run --prefix www build
          # Run the checker at the workflow revision after building from the immutable release tag.
          git show "$GITHUB_WORKFLOW_SHA:www/scripts/check-site.mjs" > "$RUNNER_TEMP/ccbox-check-site.mjs"
          cp "$RUNNER_TEMP/ccbox-check-site.mjs" www/scripts/check-site.mjs
          node www/scripts/check-site.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ccbox-website-release
          path: www/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
