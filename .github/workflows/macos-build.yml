name: Build CCBox for macOS
on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit SHA to build
        required: true
        type: string
      release:
        description: Build signed and notarized release files after checks
        required: false
        type: boolean
        default: false
      unsigned_preview:
        description: Build the release candidate without signing, published only as a labelled preview
        type: boolean
        default: false
      artifact_name:
        description: Name of the resulting workflow artifact
        required: true
        type: string
      architecture:
        description: Native package architecture (arm64 or amd64)
        required: false
        type: string
        default: arm64
permissions:
  contents: read

jobs:
  checks:
    # Both builders compile natively. Hosted runners cannot boot nested VMs.
    runs-on: ${{ inputs.architecture == 'amd64' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 90
    env:
      CCBOX_MACOS_ARCH: ${{ inputs.architecture }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Verify the exact source and native runner
        env:
          BUILD_REF: ${{ inputs.ref }}
          RELEASE_BUILD: ${{ inputs.release }}
        run: |
          [[ "$BUILD_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'Pass an exact commit SHA.' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$BUILD_REF" ]]
          case "$CCBOX_MACOS_ARCH" in arm64) machine=arm64 ;; amd64) machine=x86_64 ;; *) exit 1 ;; esac
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == "$machine" ]]
          if [[ "$RELEASE_BUILD" == true && "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            echo 'Release candidates require an explicit release dispatch.' >&2
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-python@v6
        if: inputs.architecture == 'amd64'
        with:
          python-version: '3.13'
      - name: Application version consistency
        run: |
          node scripts/check-version.mjs
          node --test scripts/macos-sshfs-sources.test.mjs
      - name: Install SSHFS build dependencies
        run: |
          brew install glib gettext pcre2
          if [[ "$CCBOX_MACOS_ARCH" == amd64 ]]; then brew install libffi pixman pkgconf meson ninja; fi
          brew upgrade glib gettext pcre2
      - name: Build the macOS application without release credentials
        env:
          CAGE_SIGNING_IDENTITY: '-'
        run: bash scripts/build-app.sh
      - name: Workbench checks
        run: |
          npm run --prefix ui lint
          npm test --prefix ui
          node --test internal/cage/clipboard.test.cjs internal/cage/browser-audit.test.mjs internal/cage/browser-downloads.test.mjs internal/cage/browser-uploads.test.mjs internal/cage/browser-login.test.mjs internal/cage/browser-clipboard.test.mjs internal/cage/native-input.test.mjs internal/cage/display-density.test.mjs
          uv run internal/cage/claude-account.test.py
          uv run internal/cage/display-governor.test.py
          uv run internal/cage/save-download.test.py
          uv run internal/cage/editor-migrate.test.py
          uv run --no-project scripts/guest-os/tests/native-maintenance.py
          uv run --no-project scripts/guest-os/tests/macos-release-downloads.py
      - name: Go tests and vet
        run: |
          make test-go
          go test -race ./internal/cage ./internal/managedproxy ./internal/workbench
          go vet ./cmd/cage ./internal/cage ./internal/managedproxy ./internal/workbench
      - name: Native application updater
        run: bash scripts/test-app-updates.sh
      - name: External Agent CLI with an isolated profile
        run: node scripts/agent-cli-smoke.mjs "$PWD/_output/ccBox.app/Contents/Resources/cage"
      - name: Native account credential status
        run: bash scripts/test-account-device.sh
      - name: Patched networking and shared files
        run: go test github.com/containers/gvisor-tap-vsock/pkg/services/dns github.com/lima-vm/lima/v2/pkg/hostagent/dns github.com/lima-vm/lima/v2/pkg/networks/usernet github.com/lima-vm/sshocker/pkg/reversesshfs
      - name: Dependency licenses
        run: bash scripts/licenses --check
      - name: Verify the application bundle
        run: |
          codesign --verify --deep --strict _output/ccBox.app
          _output/ccBox.app/Contents/Resources/cage --help
          _output/ccBox.app/Contents/Resources/mihomo -v
          case "$CCBOX_MACOS_ARCH" in arm64) machine=arm64 ;; amd64) machine=x86_64 ;; esac
          [[ "$(lipo -archs _output/ccBox.app/Contents/MacOS/Cage)" == "$machine" ]]
          if [[ "$CCBOX_MACOS_ARCH" == amd64 ]]; then
            runtime=_output/ccBox.app/Contents/Resources/intel-macos/runtime
            for executable in qemu-system-x86_64 qemu-img; do
              [[ "$(lipo -archs "$runtime/bin/$executable")" == x86_64 ]]
              "$runtime/bin/$executable" --version
            done
            "$runtime/bin/qemu-system-x86_64" -accel help | grep -Fx hvf
          fi
      - name: Archive a complete development App with executable permissions
        if: ${{ !inputs.release }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          mkdir -p _output/ci-macos-test
          archive="$PWD/_output/ci-macos-test/CCBox-$version-macos-$CCBOX_MACOS_ARCH-test.tar.gz"
          tar -czf "$archive" -C _output ccBox.app
          check=$(mktemp -d "$RUNNER_TEMP/cage-app-archive.XXXXXX")
          trap 'rm -rf "$check"' EXIT
          tar -xzf "$archive" -C "$check"
          codesign --verify --deep --strict "$check/ccBox.app"
          for executable in Contents/MacOS/Cage Contents/Resources/cage Contents/Resources/mihomo Contents/Resources/CageUpdateInstaller; do
            test -x "$check/ccBox.app/$executable"
          done
          (cd _output/ci-macos-test && shasum -a 256 "${archive##*/}" > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.release }}
        with:
          name: ${{ inputs.artifact_name }}
          path: _output/ci-macos-test/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

  release:
    if: ${{ inputs.release && github.event_name == 'workflow_dispatch' }}
    needs: checks
    runs-on: ${{ inputs.architecture == 'amd64' && 'macos-15-intel' || 'macos-15' }}
    environment: cage-release
    timeout-minutes: 90
    env:
      CCBOX_MACOS_ARCH: ${{ inputs.architecture }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Verify the exact source and native runner
        env:
          BUILD_REF: ${{ inputs.ref }}
        run: |
          [[ "$BUILD_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$BUILD_REF" ]]
          case "$CCBOX_MACOS_ARCH" in arm64) machine=arm64 ;; amd64) machine=x86_64 ;; *) exit 1 ;; esac
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == "$machine" ]]
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install SSHFS build dependencies
        run: |
          brew install glib gettext pcre2
          if [[ "$CCBOX_MACOS_ARCH" == amd64 ]]; then brew install libffi pixman pkgconf meson ninja; fi
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-python@v6
        if: inputs.architecture == 'amd64'
        with:
          python-version: '3.13'
      - name: Build, sign, notarize and verify using a temporary keychain
        if: ${{ !inputs.unsigned_preview }}
        env:
          CAGE_MACOS_P12_BASE64: ${{ secrets.CAGE_MACOS_P12_BASE64 }}
          CAGE_MACOS_P12_PASSWORD: ${{ secrets.CAGE_MACOS_P12_PASSWORD }}
          CAGE_MACOS_SIGNING_IDENTITY: ${{ secrets.CAGE_MACOS_SIGNING_IDENTITY }}
          CAGE_MACOS_NOTARY_KEY_BASE64: ${{ secrets.CAGE_MACOS_NOTARY_KEY_BASE64 }}
          CAGE_MACOS_NOTARY_KEY_ID: ${{ secrets.CAGE_MACOS_NOTARY_KEY_ID }}
          CAGE_MACOS_NOTARY_ISSUER_ID: ${{ secrets.CAGE_MACOS_NOTARY_ISSUER_ID }}
          CAGE_MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.CAGE_MACOS_PROVISIONING_PROFILE_BASE64 }}
          # Release builds require activation and online accounts.
          CCBOX_LICENSE_PUBLIC_KEY: ${{ vars.CCBOX_LICENSE_PUBLIC_KEY }}
        run: bash scripts/ci-macos-signing.sh run
      - name: Build and verify the unsigned preview
        if: ${{ inputs.unsigned_preview }}
        env:
          CCBOX_LICENSE_PUBLIC_KEY: ${{ vars.CCBOX_LICENSE_PUBLIC_KEY }}
        run: |
          bash scripts/package-macos.sh --unsigned-preview
          bash scripts/verify-macos-release.sh "$PWD/_output/releases/$(tr -d '\r\n' < VERSION)" --unsigned-preview
      - name: Remove temporary signing credentials
        if: ${{ always() }}
        run: bash scripts/ci-macos-signing.sh cleanup
      - name: Stage only public release files
        env:
          CCBOX_UNSIGNED_PREVIEW: ${{ inputs.unsigned_preview && '1' || '' }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          source_version=$(sed -n 's/^version=//p' scripts/fetch-proxy-core.sh)
          release="$PWD/_output/releases/$version"
          platform=macos
          guest_source="cage-macos-guest-$version-source.tar.gz"
          if [[ "$CCBOX_MACOS_ARCH" == amd64 ]]; then
            platform=macos-intel
            guest_source="cage-macos-guest-$version-amd64-source.tar.gz"
          fi
          node scripts/release-version.mjs metadata "$platform" "$release/build-metadata.json"
          mkdir -p _output/ci-macos-release
          cp "$release/CCBox-$version-macos-$CCBOX_MACOS_ARCH.dmg" "$release/mihomo-$source_version-source.tar.gz" "$release/$guest_source" "$release/SHA256SUMS" "$release/build-metadata.json" _output/ci-macos-release/
          (cd _output/ci-macos-release && shasum -a 256 --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: _output/ci-macos-release/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14
