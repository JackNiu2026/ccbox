name: ccBox website checks
on:
  push:
    branches: [main]
    paths: ['www/**', 'assets/**', 'README*.md', 'docs/guide/**', 'scripts/prepare-release-assets.mjs', 'packaging/**', 'VERSION', '.github/workflows/www.yml']
  pull_request:
    paths: ['www/**', 'assets/**', 'README*.md', 'docs/guide/**', 'scripts/prepare-release-assets.mjs', 'packaging/**', 'VERSION', '.github/workflows/www.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: www/package-lock.json
      - run: npm ci --prefix www
      - run: node --test www/scripts/stage-downloads.test.mjs
      - run: npm run --prefix www check
      - run: npm run --prefix www build
      - run: node www/scripts/check-site.mjs
