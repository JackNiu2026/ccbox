name: CCBox 0.20.0 platform packages
on:
  push:
    branches:
      - codex/release/0.20.0-platforms-20261124
permissions:
  contents: read
jobs:
  macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CCBOX_MACOS_ARCH: arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the exact source and native runner
        env:
          BUILD_REF: ${{ github.sha }}
        run: |
          [[ "$BUILD_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$BUILD_REF" ]]
          case "$CCBOX_MACOS_ARCH" in arm64) machine=arm64 ;; amd64) machine=x86_64 ;; *) exit 1 ;; esac
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == "$machine" ]]
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install SSHFS build dependencies
        run: |
          brew install glib gettext pcre2
          if [[ "$CCBOX_MACOS_ARCH" == amd64 ]]; then brew install libffi pixman pkgconf meson ninja; fi
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build and verify the unsigned preview
        env:
          CCBOX_LICENSE_PUBLIC_KEY: ${{ vars.CCBOX_LICENSE_PUBLIC_KEY }}
        run: |
          bash scripts/package-macos.sh --unsigned-preview
          bash scripts/verify-macos-release.sh "$PWD/_output/releases/$(tr -d '\r\n' < VERSION)" --unsigned-preview
      - name: Stage only public release files
        env:
          CCBOX_UNSIGNED_PREVIEW: "1"
        run: |
          version=$(tr -d '\r\n' < VERSION)
          source_version=$(sed -n 's/^version=//p' scripts/fetch-proxy-core.sh)
          release="$PWD/_output/releases/$version"
          platform=macos
          guest_source="cage-macos-guest-$version-source.tar.gz"
          if [[ "$CCBOX_MACOS_ARCH" == amd64 ]]; then
            platform=macos-intel
            guest_source="cage-macos-guest-$version-amd64-source.tar.gz"
          fi
          node scripts/release-version.mjs metadata "$platform" "$release/build-metadata.json"
          mkdir -p _output/ci-macos-release
          cp "$release/CCBox-$version-macos-$CCBOX_MACOS_ARCH.dmg" "$release/mihomo-$source_version-source.tar.gz" "$release/$guest_source" "$release/SHA256SUMS" "$release/build-metadata.json" _output/ci-macos-release/
          (cd _output/ci-macos-release && shasum -a 256 --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ccbox-0200-macos-arm64
          path: _output/ci-macos-release/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14
  macos-amd64:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      CCBOX_MACOS_ARCH: amd64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the exact source and native runner
        env:
          BUILD_REF: ${{ github.sha }}
        run: |
          [[ "$BUILD_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$BUILD_REF" ]]
          case "$CCBOX_MACOS_ARCH" in arm64) machine=arm64 ;; amd64) machine=x86_64 ;; *) exit 1 ;; esac
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == "$machine" ]]
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install SSHFS build dependencies
        run: |
          brew install glib gettext pcre2
          if [[ "$CCBOX_MACOS_ARCH" == amd64 ]]; then brew install libffi pixman pkgconf meson ninja; fi
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build and verify the unsigned preview
        env:
          CCBOX_LICENSE_PUBLIC_KEY: ${{ vars.CCBOX_LICENSE_PUBLIC_KEY }}
        run: |
          bash scripts/package-macos.sh --unsigned-preview
          bash scripts/verify-macos-release.sh "$PWD/_output/releases/$(tr -d '\r\n' < VERSION)" --unsigned-preview
      - name: Stage only public release files
        env:
          CCBOX_UNSIGNED_PREVIEW: "1"
        run: |
          version=$(tr -d '\r\n' < VERSION)
          source_version=$(sed -n 's/^version=//p' scripts/fetch-proxy-core.sh)
          release="$PWD/_output/releases/$version"
          platform=macos
          guest_source="cage-macos-guest-$version-source.tar.gz"
          if [[ "$CCBOX_MACOS_ARCH" == amd64 ]]; then
            platform=macos-intel
            guest_source="cage-macos-guest-$version-amd64-source.tar.gz"
          fi
          node scripts/release-version.mjs metadata "$platform" "$release/build-metadata.json"
          mkdir -p _output/ci-macos-release
          cp "$release/CCBox-$version-macos-$CCBOX_MACOS_ARCH.dmg" "$release/mihomo-$source_version-source.tar.gz" "$release/$guest_source" "$release/SHA256SUMS" "$release/build-metadata.json" _output/ci-macos-release/
          (cd _output/ci-macos-release && shasum -a 256 --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ccbox-0200-macos-amd64
          path: _output/ci-macos-release/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14
